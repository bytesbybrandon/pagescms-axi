name: Publish to npm

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish verified package
    needs: verify
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use npm trusted publishing support
        run: npm install --global npm@11.15.0

      - name: Install dependencies
        run: npm ci

      - name: Validate release metadata
        id: release
        run: node scripts/verify-release.mjs

      - name: Pack and smoke-test release artifact
        id: package
        run: npm run verify:package -- --keep

      - name: Publish to npm
        env:
          NPM_TAG: ${{ steps.release.outputs.npm_tag }}
          PACKAGE_TARBALL: ${{ steps.package.outputs.tarball }}
        run: npm publish "$PACKAGE_TARBALL" --tag "$NPM_TAG"
